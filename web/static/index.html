<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Showcase Web</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- The artwork: two slides that crossfade -->
<div id="slides">
    <div class="slide visible"><img class="art" src="images/background.jpg" alt=""></div>
    <div class="slide"><img class="art" alt=""></div>
</div>

<!-- Soft dark fades so the text stays readable on bright artwork (not shifted by burn-in protection) -->
<div class="shade top"></div>
<div class="shade bottom"></div>

<!-- Text and poster -->
<div id="overlay">
    <div id="info" class="info">
        <div id="clock" class="clock"></div>
        <div id="date" class="detail"></div>
        <div id="weather" class="detail weather" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"></svg><span></span>
        </div>
    </div>
    <img id="poster" class="poster" alt="" hidden>
    <div id="caption" class="caption">
        <img id="logo" class="logo" alt="" hidden>
        <div id="title" class="title"></div>
        <div id="details" class="detail details"></div>
    </div>
</div>

<!-- Night dimming: a black layer over everything -->
<div id="dim"></div>

<p id="message" hidden></p>
<script src="js/weather-icons.js"></script>
<script src="js/showcase.js"></script>
</body>
</html>
