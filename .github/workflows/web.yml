name: Web checks

on:
  push:
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyflakes
      - run: python -m pyflakes app.py admin.py settings.py plexapi.py
      - name: App starts and serves the screensaver
        run: |
          python -c "import app; c = app.app.test_client(); r = c.get('/screen/'); assert r.status_code == 200, r.status_code; print('ok')"
